name: GHOST Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon -p android-companion :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-security-center-debug
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
