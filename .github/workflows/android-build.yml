name: GHOST Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon -p android-companion :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-security-center-debug
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/ghost-security-center'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release keystore
        env:
          GHOST_KEYSTORE_BASE64: ${{ secrets.GHOST_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$GHOST_KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/ghost-release.jks"
          printf '%s' "$GHOST_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "GHOST_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          GHOST_KEYSTORE_PASSWORD: ${{ secrets.GHOST_KEYSTORE_PASSWORD }}
          GHOST_KEY_ALIAS: ${{ secrets.GHOST_KEY_ALIAS }}
          GHOST_KEY_PASSWORD: ${{ secrets.GHOST_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$GHOST_KEYSTORE_PASSWORD"
          test -n "$GHOST_KEY_ALIAS"
          test -n "$GHOST_KEY_PASSWORD"
          gradle --no-daemon -p android-companion :app:assembleRelease

      - name: Verify APK identity and signature
        run: |
          set -eu

          APK="android-companion/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE_LINE" | grep -F "name='com.ghost.securitycenter'"

          echo "===== GHOST APK DIAGNOSTICS ====="
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:)"
          echo "===== END APK DIAGNOSTICS ====="

          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/ghost-cert.txt"

          ACTUAL_FINGERPRINT="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/ghost-cert.txt" | head -n 1 | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_FINGERPRINT="6a8821d3c8cb541a45c858d045a0185192691e2aa7ecea58bf73ec02a9a9bef7"

          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"

          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/ghost-apk-sha256.txt"

      - name: Publish signed release to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK="android-companion/app/build/outputs/apk/release/app-release.apk"
          TAG="v0.2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" ghost-apk-sha256.txt --clobber
          else
            gh release create "$TAG" "$APK" ghost-apk-sha256.txt \
              --title "GHOST Security Center v0.2.0" \
              --notes "Signed APK released by the GHOST Android Build workflow."
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-security-center-release
          path: |
            android-companion/app/build/outputs/apk/release/app-release.apk
            ghost-apk-sha256.txt
          if-no-files-found: error
